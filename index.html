<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0c0b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Last Wager" />
    <meta name="description" content="A dark-fantasy poker roguelike where chips are life." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Last Wager" />
    <meta property="og:description" content="A dark-fantasy poker roguelike. Real No-limit Hold’em, where the chips are your life." />
    <meta property="og:image" content="https://saveriobanchi.github.io/Poker/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://saveriobanchi.github.io/Poker/" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>The Last Wager</title>
    <style>
      /* Loading splash: inline so it paints before the game's script and styles arrive. */
      html { background: #0d0b0a; }
      #splash { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: radial-gradient(90% 60% at 50% 40%, #1e1612, #0d0b0a 70%); color: #e2a97e; font: 600 13px/1.4 Cinzel, 'Times New Roman', serif; letter-spacing: 0.3em; text-transform: uppercase; transition: opacity 400ms; }
      #splash.gone { opacity: 0; pointer-events: none; }
      #splash svg { width: 120px; height: 120px; }
      #splash .turn { transform-origin: 60px 60px; animation: splash-turn 2.4s linear infinite; }
      @keyframes splash-turn { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #splash .turn { animation: none; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading The Last Wager">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="44" fill="none" stroke="#7a4a2e" stroke-width="1" stroke-dasharray="2 5" class="turn" />
        <circle cx="60" cy="60" r="34" fill="none" stroke="#b8734a" stroke-width="1.2" />
        <circle cx="63" cy="57" r="30" fill="#0d0b0a" />
        <path d="M60 60m-30 0a30 30 0 0 1 30-30" fill="none" stroke="#e2a97e" stroke-width="2" stroke-linecap="round" transform="rotate(-90 60 60)" />
      </svg>
      <span>The Last Wager</span>
    </div>
    <header id="hud">
      <button id="hand-info" type="button" aria-expanded="false" aria-label="Table and route details">The Last Wager</button>
      <span class="hud-buttons">
        <button id="btn-sound" type="button" aria-pressed="true" aria-label="Sound"></button>
        <button id="btn-motion" type="button" aria-pressed="false" aria-label="Reduce motion" title="Reduce motion"></button>
        <button id="btn-speed" type="button" aria-pressed="false" aria-label="Normal speed"></button>
        <button id="btn-playtest" type="button" aria-label="Playtest log" title="Playtest log" hidden></button>
        <button id="btn-new" type="button" aria-label="New run"><span class="long">New run</span><span class="short">New</span></button>
      </span>
    </header>
    <main id="game" aria-label="Poker table"></main>
    <section id="panel" aria-label="Your actions">
      <p id="ticker" aria-live="polite"></p>
      <p id="relic-strip" hidden></p>
      <div id="spell-row" hidden>
        <span id="aether" title="Aether"></span>
        <div id="spells" aria-label="Your spells"></div>
      </div>
      <div id="spell-choice" hidden></div>
      <p id="spell-reason" role="status" hidden></p>
      <div id="spell-info" hidden></div>
      <p id="odds" hidden></p>
      <div id="raise-row" hidden>
        <div id="raise-presets"></div>
        <input id="raise-slider" type="range" aria-label="Raise amount" />
        <button id="btn-custom" type="button" aria-expanded="false" aria-label="Choose a custom amount"></button>
      </div>
      <div id="action-row">
        <button id="btn-fold" type="button" disabled>Fold</button>
        <button id="btn-call" type="button" disabled>Check</button>
        <button id="btn-raise" type="button" class="primary" disabled>Raise</button>
      </div>
      <button id="btn-pass" type="button" class="wide" hidden>Cast no spell</button>
      <button id="btn-evolve" type="button" class="wide evolve-cta" hidden>A spell can evolve</button>
      <button id="btn-next" type="button" class="primary wide" hidden>Deal next hand</button>
    </section>
    <section id="screen" aria-live="polite" hidden></section>
    <div id="claim" role="dialog" aria-modal="true" aria-label="Last Claim" hidden></div>
    <div id="overlay" hidden></div>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
